---
# NodeFeatureRule from intel/intel-device-plugins-for-kubernetes v0.37.0
# deployments/nfd/overlays/node-feature-rules/node-feature-rules.yaml, reduced
# to the GPU rule (the others label DSA, IAA, QAT, SGX, DLB, FPGA, NPU, which
# this homelab does not use). Needs node-feature-discovery installed
# (nfd.k8s-sigs.io CRDs); the installer applies it when ENABLE_NFD_RULES=true.
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-dp-devices
spec:
  rules:
    - name: "intel.gpu"
      labels:
        "intel.feature.node.kubernetes.io/gpu": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["8086"]}
            class: {op: In, value: ["0300", "0380"]}
      matchAny:
        - matchFeatures:
          - feature: kernel.loadedmodule
            matchExpressions:
              i915: {op: Exists}
        - matchFeatures:
          - feature: kernel.enabledmodule
            matchExpressions:
              i915: {op: Exists}
        - matchFeatures:
          - feature: kernel.loadedmodule
            matchExpressions:
              xe: {op: Exists}
        - matchFeatures:
          - feature: kernel.enabledmodule
            matchExpressions:
              xe: {op: Exists}
