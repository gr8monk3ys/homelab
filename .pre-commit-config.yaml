# Pre-commit hooks for fast local quality gates.
# Install: https://pre-commit.com
#
# Enable:
#   pre-commit install
#   pre-commit install --hook-type pre-push  # optional (runs the full ./scripts/ci.sh gate)

exclude: |
  (?x)^(
    \.claude/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: |
          (?x)^(
            helm/.*/templates/
          )
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        files: "\\.(yaml|yml)$"

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "-s", "bash", "-S", "warning"]
        files: "\\.sh$|^setup\\.sh\\.deprecated$"

  # Optional (opt-in) pre-push gate. Enable with:
  #   pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: ci-pre-push
        name: repo ci (pre-push)
        entry: bash -lc 'CI=true ./scripts/ci.sh'
        language: system
        pass_filenames: false
        stages: ["pre-push"]
