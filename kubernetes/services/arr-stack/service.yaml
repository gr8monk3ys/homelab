---
# Service descriptor: the install interface read by scripts/lib/services.sh.
namespace: arr-stack
group: media
url: sonarr
description: Sonarr, Radarr, Prowlarr, Bazarr
requires: [authelia]   # its Ingress routes through Authelia's forward-auth middleware
steps:
  - apply: shared-storage.yaml

# Per-namespace isolation: policy templates under kubernetes/security/network-policies/templates/.
# Deliberately open: talks to qBittorrent in another namespace; needs a cross-namespace rule before it can be isolated.
networkPolicies: []
