---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: arr-stack
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "10"
    # Storage per class: the SSD budget stays small; the shared media tree
    # is one static bulk volume (shared-storage.yaml).
    local-path.storageclass.storage.k8s.io/requests.storage: 50Gi
    bulk.storageclass.storage.k8s.io/requests.storage: 4Ti
    pods: "15"
