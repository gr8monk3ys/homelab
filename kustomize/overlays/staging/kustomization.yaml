apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: homelab-staging

# Note: namespace override removed to preserve per-service namespaces

resources:
  - ../../base

# Note: namePrefix removed to preserve resource naming consistency

labels:
  - pairs:
      environment: staging
      tier: staging
    includeSelectors: false

# Note: controller replicas and image pinning are managed by Helm chart values.

configMapGenerator:
  - name: homelab-config
    literals:
      - domain=homelab-staging.local
      - timezone=America/New_York
      - environment=staging
      - log_level=debug
      - backup_enabled=true
      - monitoring_enabled=true
