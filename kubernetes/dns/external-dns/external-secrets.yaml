---
# ExternalSecret for ExternalDNS Cloudflare API token.
#
# Source secret (source-of-truth):
# - Namespace: secrets
# - Name:      cloudflare-api-token
# - Key:       token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: cloudflare-api-token
      property: token

