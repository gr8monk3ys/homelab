---
# Service descriptor: the install interface read by scripts/lib/services.sh.
name: frigate
namespace: frigate
group: home
optin: true
url: frigate
description: Local NVR with object detection; publishes to Mosquitto in the home-assistant namespace

# Per-namespace isolation: policy templates under kubernetes/security/network-policies/templates/.
# Frigate also needs MQTT to the home-assistant namespace and RTSP to cameras
# on the LAN: both are cross-namespace or off-cluster, so they live in
# kubernetes/security/network-policies/cross-namespace-policies.yaml.
networkPolicies: [default-deny, allow-dns, allow-ingress, allow-monitoring, allow-same-namespace]
