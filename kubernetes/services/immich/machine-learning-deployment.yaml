---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app: immich-machine-learning
spec:
  # No `replicas:` on purpose (the API server defaults it to 1): when
  # IMMICH_ML_URL points at a machine-learning service outside the cluster
  # (a GPU host), scale this to 0 and a re-install leaves it there
  # (docs/runbooks/storage-and-hardware.md, "A GPU outside the cluster").
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: MACHINE_LEARNING_CACHE_FOLDER
          value: "/cache"
        - name: TRANSFORMERS_CACHE
          value: "/cache"
        ports:
        - containerPort: 3003
          name: http
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: home-cache
          mountPath: /.cache
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: immich-models-pvc
      - name: home-cache
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app: immich-machine-learning
  ports:
  - name: http
    port: 3003
    targetPort: 3003
  type: ClusterIP
---
# Downloaded models: SSD.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-models-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
