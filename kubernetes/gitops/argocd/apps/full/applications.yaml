---
# Optional Applications
#
# This file is included by `kubernetes/gitops/argocd/apps/full/kustomization.yaml`.

# Immich Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  project: homelab-media
  source:
    repoURL: https://github.com/your-username/homelab.git
    targetRevision: HEAD
    path: kubernetes/services/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
