---
# Service descriptor: the install interface read by scripts/lib/services.sh.
name: yarr
namespace: yarr
group: content
url: rss
description: RSS reader

# Per-namespace isolation: policy templates under kubernetes/security/network-policies/templates/.
# allow-external-https: this service fetches from the internet.
networkPolicies: [default-deny, allow-dns, allow-ingress, allow-monitoring, allow-same-namespace, allow-external-https]
