---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: immich
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    # Storage per class: Postgres, Redis, thumbnails and models on the SSD;
    # the upload location is one static bulk volume (storage.yaml).
    local-path.storageclass.storage.k8s.io/requests.storage: 100Gi
    bulk.storageclass.storage.k8s.io/requests.storage: 2Ti
    pods: "15"
