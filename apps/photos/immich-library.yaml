---
# Immich's media location on the SSD: ${PHOTOS_PATH}, holding library/,
# thumbs/, backups/ (nightly database dumps), encoded-video/ and profile/
# (owned 1000:1000; host/setup.sh creates it). Mounted at /data. ADR 0013.
# Backed up offsite as PVC immich (components/volsync, APP=immich).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 250Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: photos
    name: immich
  hostPath:
    path: "${PHOTOS_PATH}"
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich
  namespace: photos
spec:
  storageClassName: ""
  volumeName: immich-library
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 250Gi
