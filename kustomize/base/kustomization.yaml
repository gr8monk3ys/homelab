apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: homelab-base

resources:
  - ../../kubernetes/secrets/secrets-namespace.yaml
  - ../../kubernetes/secrets/secret-store-rbac.yaml
  - ../../kubernetes/secrets/secret-store.yaml
  - ../../kubernetes/storage/
  - ../../kubernetes/ingress/cert-manager/

labels:
  - pairs:
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# Note: Core controllers (Traefik, cert-manager, external-secrets) are installed via Helm.
