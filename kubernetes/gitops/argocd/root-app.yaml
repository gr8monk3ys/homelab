---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  project: homelab-infrastructure
  source:
    repoURL: https://github.com/your-username/homelab.git
    targetRevision: HEAD
    path: kubernetes/gitops/argocd/apps/core
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
