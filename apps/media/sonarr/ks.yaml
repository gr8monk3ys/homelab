---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./apps/media/sonarr/app
  components:
    - ../../../../components/volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  postBuild:
    substitute:
      APP: sonarr
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
