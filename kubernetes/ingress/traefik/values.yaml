# Minimal, sane defaults for a homelab.
# Keep this file small; prefer per-service annotations for routing behavior.

deployment:
  replicas: 1
  # Write access logs to the node so the CrowdSec agent can tail them
  # (kubernetes/security/crowdsec/deployment.yaml mounts the same hostPath).
  additionalVolumes:
    - name: traefik-logs
      hostPath:
        path: /var/log/traefik
        type: DirectoryOrCreate
  # The kubelet creates that hostPath as root:root 0755, and Traefik runs as the
  # chart's non-root user (65532) with every capability dropped, so without this
  # it cannot open access.log and CrowdSec sees no traffic (#36). fsGroup does not
  # apply to hostPath. Hand the directory to Traefik's user before it starts;
  # CrowdSec (UID 1000) keeps read access through 0755. FOWNER lets root chmod
  # the directory on a restart, when it already belongs to 65532; with CHOWN
  # alone the chmod fails and Traefik never starts again after a node reboot.
  initContainers:
    - name: traefik-log-dir
      image: busybox:1.37.0
      command: ["sh", "-c", "chmod 0755 /var/log/traefik && chown 65532:65532 /var/log/traefik"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN, FOWNER]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 16Mi
      volumeMounts:
        - name: traefik-logs
          mountPath: /var/log/traefik

additionalVolumeMounts:
  - name: traefik-logs
    mountPath: /var/log/traefik

service:
  type: LoadBalancer

providers:
  kubernetesCRD:
    enabled: true
    # Ingresses reference middlewares in other namespaces
    # (authelia-authelia-forwardauth, crowdsec-crowdsec-bouncer).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# Make Traefik handle Ingress resources by default unless an ingressClassName is set.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true
      # Screen every request through the CrowdSec bouncer
      # (Middleware in kubernetes/security/crowdsec/deployment.yaml).
      middlewares:
        - crowdsec-crowdsec-bouncer@kubernetescrd

logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
    filePath: /var/log/traefik/access.log

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
