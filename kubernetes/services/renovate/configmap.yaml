---
# Renovate runtime settings. Edit this ConfigMap after install:
#
#   RENOVATE_REPOSITORIES is the placeholder `your-username/homelab`. The
#   installer's render step replaces only the GitOps repo URL
#   (https://github.com/your-username/homelab.git), NOT this bare owner/name,
#   so the operator sets it by hand:
#     kubectl -n renovate edit configmap renovate-config
#   (or edit here and re-apply). Until then every run fails fast with a
#   "repository not found" from GitHub, which is the safe default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
  labels:
    app: renovate
data:
  RENOVATE_PLATFORM: "github"
  RENOVATE_REPOSITORIES: "your-username/homelab"
  # Renovate reads the repository config from the repository itself: the
  # root renovate.json5 (schedule, limits, the tools/versions.env annotations,
  # grouping). Nothing else belongs here; a key with a dot is not a valid
  # environment variable name for envFrom anyway.
