---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Core ArgoCD Applications ("app-of-apps").
#
# Infrastructure apps plus every service the installer deploys by default
# (../services/default.yaml, generated from the catalogue). Everything else
# lives in `../full`.

resources:
  - applications.yaml
  - ../services/default.yaml

configMapGenerator:
  - name: homelab-gitops-config
    literals:
      # Update this in one place to change the repo URL for all child Applications.
      - repoURL=https://github.com/your-username/homelab.git

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: homelab-gitops-config
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
