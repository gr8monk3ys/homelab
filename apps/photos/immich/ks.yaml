---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  dependsOn:
    - name: immich-db
  targetNamespace: photos
  path: ./apps/photos/immich/app
  # Backs up PVC immich: the whole library, including the database dumps.
  components:
    - ../../../../components/volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  postBuild:
    substitute:
      APP: immich
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
