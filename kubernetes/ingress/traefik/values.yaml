# Minimal, sane defaults for a homelab.
# Keep this file small; prefer per-service annotations for routing behavior.

deployment:
  replicas: 1

service:
  type: LoadBalancer

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

# Make Traefik handle Ingress resources by default unless an ingressClassName is set.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true

logs:
  general:
    level: INFO

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
