---
prometheus:
  prometheusSpec:
    retention: 30d
    # Discover ServiceMonitors/PodMonitors/PrometheusRules across the cluster.
    # By default, kube-prometheus-stack restricts discovery to resources labeled with the Helm release.
    # This repo defines ServiceMonitors and PrometheusRules in multiple namespaces, so we opt into broad discovery.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 500m

grafana:
  # Admin credentials managed via ExternalSecret
  admin:
    existingSecret: grafana-admin
    userKey: username
    passwordKey: password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: "homelab-ca"
    hosts:
      - grafana.homelab.local
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.homelab.local
  grafana.ini:
    server:
      domain: grafana.homelab.local
      root_url: https://grafana.homelab.local
    security:
      allow_embedding: true
  # Requests and limits for Grafana, its dashboard/datasource sidecars (one
  # `sidecar.resources` covers both) and the init container that chowns the
  # PVC: the monitoring ResourceQuota refuses a pod without them.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        cpu: 100m
        memory: 192Mi
  initChownData:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

alertmanager:
  alertmanagerSpec:
    # Allow AlertmanagerConfig discovery across namespaces. This enables opt-in alert routing
    # via `kubernetes/monitoring/alertmanager/*`.
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# The monitoring ResourceQuota rejects a pod without requests and limits.
# The existing node-exporter pod predates the quota, but a new one (a second
# node, or a re-created pod) would be refused. The same goes for
# kube-state-metrics.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# The operator's admission-webhook certificate Jobs (create and patch) run as
# Helm hooks on every install and upgrade. The monitoring ResourceQuota
# (kubernetes/security/resource-quotas.yaml) rejects a pod without requests
# and limits, so without these a re-run of setup-v2.sh fails at this release.
prometheusOperator:
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # The config-reloader sidecar (and its init container) the operator injects
  # into the Prometheus and Alertmanager pods.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# K3s runs the controller manager, scheduler and kube-proxy inside the k3s
# binary with their metrics bound to 127.0.0.1, and a single-server K3s keeps
# its state in SQLite (kine), not etcd. Nothing answers on 10257/10259/10249/
# 2381 from a pod, so these ServiceMonitors (and their always-firing
# "...Down" alerts) are off. The API server, kubelet (with cAdvisor) and
# CoreDNS are scraped as usual.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # no etcd to scrape, see kubeEtcd above
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false  # embedded in K3s, see kubeProxy above
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false  # embedded in K3s, see kubeScheduler above
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
