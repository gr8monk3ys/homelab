---
# CrowdSec Agent Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec
    component: agent
spec:
  replicas: 1
  # Single replica on a ReadWriteOnce PVC: Recreate, per the repo rule. A
  # rolling update also cannot fit two agents in the namespace memory quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crowdsec
      component: agent
  template:
    metadata:
      labels:
        app: crowdsec
        component: agent
    spec:
      serviceAccountName: crowdsec
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The image's entrypoint installs hub items, registers the local agent
      # and bouncer, and rewrites config.yaml, all under /etc/crowdsec. With
      # read-only subPath mounts and a non-root user it could do none of that
      # and the agent crash-looped, so the bouncer failed closed and every
      # HTTPS request got 403 (#42). /etc/crowdsec is now a writable emptyDir,
      # seeded with the image's /staging/etc/crowdsec (hub, patterns, ...) and
      # then this repo's config files on top. The entrypoint only copies
      # /staging itself when no config.yaml exists, so it must happen here.
      initContainers:
      - name: seed-etc
        image: crowdsecurity/crowdsec:v1.6.0
        # The credential files live on the data PVC (configmap.yaml). cscli loads
        # both while the entrypoint is still creating them, so, as the image's own
        # /staging templates do, start them empty on first run.
        # (The /staging credential templates are root-only and not needed here.)
        command:
        - sh
        - -c
        - |
          set -e
          for f in /staging/etc/crowdsec/*; do
            case "$(basename "$f")" in *_api_credentials.yaml) ;; *) cp -R "$f" /seed/ ;; esac
          done
          cp /config/config.yaml /config/profiles.yaml /config/simulation.yaml /acquis/acquis.yaml /seed/
          touch /data/local_api_credentials.yaml /data/online_api_credentials.yaml
          # The entrypoint symlinks missing GeoIP databases to root-owned /staging
          # copies, which the hub update then cannot overwrite. Real copies can be.
          for db in /staging/var/lib/crowdsec/data/*.mmdb; do
            t="/data/$(basename "$db")"
            [ -L "$t" ] && rm -f "$t"
            [ -e "$t" ] || cp "$db" "$t"
          done
        resources:   # the namespace ResourceQuota requires them on every container
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: etc
          mountPath: /seed
        - name: config
          mountPath: /config
          readOnly: true
        - name: acquis
          mountPath: /acquis
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      - name: crowdsec
        image: crowdsecurity/crowdsec:v1.6.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        # The entrypoint registers the Traefik bouncer with this key; without it
        # the bouncer's key is unknown to the Local API and every check fails.
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-config
              key: bouncer-api-key
        - name: COLLECTIONS
          value: "crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
        - name: SCENARIOS
          value: "crowdsecurity/ssh-bf crowdsecurity/http-bf-wordpress_bf crowdsecurity/http-crawl-non_statics"
        - name: PARSERS
          value: "crowdsecurity/traefik-logs crowdsecurity/sshd-logs"
        - name: DISABLE_LOCAL_API
          value: "false"
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-config
              key: enroll-key
              optional: true
        ports:
        - containerPort: 8080
          name: api
        - containerPort: 6060
          name: metrics
        volumeMounts:
        - name: etc
          mountPath: /etc/crowdsec
        - name: data
          mountPath: /var/lib/crowdsec/data
        - name: traefik-logs
          mountPath: /var/log/traefik
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: etc
        emptyDir: {}
      - name: config
        configMap:
          name: crowdsec-config
      - name: acquis
        configMap:
          name: crowdsec-acquis
      - name: data
        persistentVolumeClaim:
          claimName: crowdsec-data-pvc
      - name: traefik-logs
        hostPath:
          path: /var/log/traefik
          type: DirectoryOrCreate
---
# CrowdSec Traefik Bouncer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-traefik-bouncer
  namespace: crowdsec
  labels:
    app: crowdsec
    component: bouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec
      component: bouncer
  template:
    metadata:
      labels:
        app: crowdsec
        component: bouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bouncer
        image: fbonalair/traefik-crowdsec-bouncer:0.5.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
        - name: CROWDSEC_BOUNCER_API_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-config
              key: bouncer-api-key
        - name: CROWDSEC_AGENT_HOST
          value: "crowdsec-agent:8080"
        - name: CROWDSEC_BOUNCER_LOG_LEVEL
          value: "1"
        - name: GIN_MODE
          value: "release"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /api/v1/ping
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/ping
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-data-pvc
  namespace: crowdsec
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec
spec:
  selector:
    app: crowdsec
    component: agent
  ports:
  - name: api
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 6060
    targetPort: 6060
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-bouncer
  namespace: crowdsec
  labels:
    app: crowdsec
spec:
  selector:
    app: crowdsec
    component: bouncer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec
  namespace: crowdsec
---
# RBAC for reading pods/logs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crowdsec-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crowdsec-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec-reader
subjects:
- kind: ServiceAccount
  name: crowdsec
  namespace: crowdsec
---
# Traefik ForwardAuth Middleware for CrowdSec
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: crowdsec
spec:
  forwardAuth:
    address: http://crowdsec-bouncer.crowdsec.svc.cluster.local:8080/api/v1/forwardAuth
    trustForwardHeader: true
---
# ExternalSecret for CrowdSec configuration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-config
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: crowdsec-config
    creationPolicy: Owner
  data:
  - secretKey: bouncer-api-key
    remoteRef:
      key: crowdsec-config
      property: bouncer-api-key
  - secretKey: enroll-key
    remoteRef:
      key: crowdsec-config
      property: enroll-key
