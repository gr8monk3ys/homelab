---
# =============================================================================
# Pod Security Standards (Audit Mode)
# =============================================================================
# Safe migration path for Pod Security Admission:
# - enforce=privileged (no blocking)
# - audit/warn set to the intended target level
#
# Switch to enforce mode by applying pod-security-standards-enforce.yaml (or
# setting POD_SECURITY_MODE=enforce in setup-v2.sh).
# =============================================================================

# -----------------------------------------------------------------------------
# Sensitive Services (target: restricted/baseline)
# -----------------------------------------------------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
  labels:
    name: vaultwarden
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
