---
# ServiceMonitor for Authelia
# Authelia exposes Prometheus metrics at /metrics on its telemetry port
# (9959, the Service's `metrics` port), not on the web port 9091.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authelia
  namespace: authelia
  labels:
    app: authelia
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: authelia
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
