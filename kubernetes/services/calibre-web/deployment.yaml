apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  replicas: 1
  # Single writer on a ReadWriteOnce volume: RWO pins the volume to one node,
  # so a rolling update would briefly run two writers there, or stall across
  # nodes. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      # Shares the ReadWriteOnce config and books PVCs with calibre-server: must run on its node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: calibre-server
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: calibre-web
        image: lscr.io/linuxserver/calibre-web:0.6.23
        # Security exception (namespace enforces baseline, not restricted):
        # the LinuxServer.io s6 init must start as root, remap user abc to
        # PUID/PGID (usermod/groupmod), chown /config, then drop to abc via
        # setgroups/setuid before the app starts. With every capability dropped
        # it dies with "s6-applyuidgid: unable to set supplementary group
        # list" and never listens on 8083. This image has no non-root mode
        # (started as 1000:1000 its init-adduser fails on /etc/group and
        # lsiown), and there is no maintained non-root calibre-web image. So
        # ALL is still dropped and only the baseline-allowed capabilities the
        # init needs are added back; privilege escalation stays off and the
        # app itself runs as uid 1000.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
        ports:
        - containerPort: 8083
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        # DOCKER_MODS=linuxserver/mods:universal-calibre is deliberately not
        # set: it downloads several hundred MB of calibre binaries on every
        # container start (slower than any probe allows, and a network
        # dependency at boot). Ebook conversion is served by calibre-server.
        - name: TZ
          value: "UTC"
        - name: OAUTHLIB_RELAX_TOKEN_SCOPE
          value: "1"
        volumeMounts:
        - name: calibre-config
          mountPath: /config
        - name: calibre-books
          mountPath: /books
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # First start initialises app.db in /config; allow up to 5 minutes
        # before liveness can restart it.
        startupProbe:
          tcpSocket:
            port: 8083
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8083
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: calibre-config
        persistentVolumeClaim:
          claimName: calibre-config-pvc
      - name: calibre-books
        persistentVolumeClaim:
          claimName: calibre-books-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config-pvc
  namespace: calibre-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-books-pvc
  namespace: calibre-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  selector:
    app: calibre-web
  ports:
  - port: 8083
    targetPort: 8083
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web-ingress
  namespace: calibre-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "homelab-ca"
spec:
  tls:
  - hosts:
    - books.homelab.local
    secretName: calibre-web-tls
  rules:
  - host: books.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-web
            port:
              number: 8083
---
# Optional: Calibre server for ebook conversion
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-server
  namespace: calibre-web
spec:
  replicas: 1
  # Single writer on a ReadWriteOnce volume: RWO pins the volume to one node,
  # so a rolling update would briefly run two writers there, or stall across
  # nodes. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre-server
  template:
    metadata:
      labels:
        app: calibre-server
    spec:
      securityContext:
        # The s6 init runs as root and drops to PUID/PGID (1000) for calibre;
        # see the container's securityContext for the capabilities it keeps.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: calibre-server
        image: lscr.io/linuxserver/calibre:7.23.0
        ports:
        - containerPort: 8080
          name: web
        - containerPort: 8081
          name: server
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "UTC"
        volumeMounts:
        - name: calibre-config
          mountPath: /config
        - name: calibre-books
          mountPath: /books
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        # Security exception, the same one calibre-web carries (see there):
        # the LinuxServer.io s6 init starts as root, remaps user abc to
        # PUID/PGID, chowns /config and nginx's /var/lib/nginx, then drops to
        # abc via setgroups/setuid. With every capability dropped it loops on
        # "s6-applyuidgid: unable to set supplementary group list" and nginx
        # "chown(/var/lib/nginx/body) failed", and nothing listens on 8080.
        # There is no maintained rootless image of the calibre desktop
        # (home-operations/containers has none; the headless calibre-server
        # images are unmaintained single-user builds on EOL bases). So ALL is
        # still dropped and only the baseline-allowed capabilities the init
        # needs are added back; privilege escalation stays off and calibre
        # itself runs as uid 1000.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
        # The KasmVNC web desktop on 8080. (8081, calibre's content server,
        # listens only once it is switched on inside the desktop.)
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
      volumes:
      - name: calibre-config
        persistentVolumeClaim:
          claimName: calibre-config-pvc
      - name: calibre-books
        persistentVolumeClaim:
          claimName: calibre-books-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-server
  namespace: calibre-web
spec:
  selector:
    app: calibre-server
  ports:
  - port: 8080
    targetPort: 8080
    name: web
  - port: 8081
    targetPort: 8081
    name: server
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-server-ingress
  namespace: calibre-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # The calibre web desktop (KasmVNC) has no login of its own: gate it
    # behind Authelia like the arr apps.
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
    cert-manager.io/cluster-issuer: "homelab-ca"
spec:
  tls:
  - hosts:
    - calibre.homelab.local
    secretName: calibre-server-tls
  rules:
  - host: calibre.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calibre-server
            port:
              number: 8080
