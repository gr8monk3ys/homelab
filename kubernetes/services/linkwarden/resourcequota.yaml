---
# Sized to fit every pod in the namespace at once (app + database)
# plus the PVCs declared here. A quota smaller than the sum blocks the
# database pod from being (re)created while the app pod holds the quota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: linkwarden
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "3"
    requests.storage: 40Gi
    pods: "5"
