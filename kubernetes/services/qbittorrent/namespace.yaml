---
# Pod Security: privileged, not baseline like arr-stack. The gluetun VPN
# sidecar (deployment.yaml) needs NET_ADMIN to create its WireGuard interface
# and kill-switch firewall, and baseline allows no capability beyond its
# fixed list (NET_ADMIN is not on it), so baseline would reject the pod. The
# exception is that one container; qBittorrent itself runs non-root with ALL
# capabilities dropped. Same reasoning as the tailscale namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
