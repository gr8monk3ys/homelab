---
# gluetun's VPN settings. Every value is a Flux substitution from
# cluster-secrets (hack/cluster-secrets.sh), so this file holds no credential.
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-vpn
type: Opaque
stringData:
  VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER}"
  WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
  WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES}"
  SERVER_COUNTRIES: "${SERVER_COUNTRIES}"
