# Pre-commit hooks for fast local checks.
# Install: https://pre-commit.com
#
#   pre-commit install
#   pre-commit install --hook-type pre-push  # optional: runs hack/validate.sh

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        files: "\\.(yaml|yml)$"

  # A commit must not carry an age private key or a plain Secret.
  - repo: local
    hooks:
      - id: no-age-key
        name: no age private key
        entry: "AGE-SECRET-KEY-"
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$
      - id: validate-pre-push
        name: hack/validate.sh (pre-push)
        entry: bash hack/validate.sh
        language: system
        pass_filenames: false
        stages: ["pre-push"]
