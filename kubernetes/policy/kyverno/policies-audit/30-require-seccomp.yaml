---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-require-seccomp-runtime-default
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-seccomp-runtime-default
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  homelab-kyverno: enabled
      validate:
        message: "Pods should set securityContext.seccompProfile.type=RuntimeDefault."
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault

