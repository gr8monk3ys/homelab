---
# Static NetworkPolicies in this namespace: the per-pod and cross-namespace
# rules the networkPolicies: templates in service.yaml cannot express.
# Applied by install_service with the rest of this directory.

# Paperless PostgreSQL - Only allow connections from paperless app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-postgres-policy
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app: paperless-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paperless-ngx
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
# Paperless Redis - Only allow connections from paperless app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-redis-policy
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app: paperless-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paperless-ngx
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app: paperless-ngx
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: paperless-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app: paperless-ngx
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: paperless-redis
      ports:
        - protocol: TCP
          port: 6379
---
# Paperless-ngx - Document management
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-policy
  namespace: paperless-ngx
spec:
  podSelector:
    matchLabels:
      app: paperless-ngx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL connection
    - to:
        - podSelector:
            matchLabels:
              app: paperless-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis connection
    - to:
        - podSelector:
            matchLabels:
              app: paperless-redis
      ports:
        - protocol: TCP
          port: 6379
