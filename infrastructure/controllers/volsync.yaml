---
# VolSync: offsite PVC backups (restic to Backblaze B2). Apps opt in through
# components/volsync; restores go through hack/restore.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: volsync-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: backube
  namespace: volsync-system
spec:
  interval: 12h
  url: https://backube.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 1h
  # VolSync's controller exits unless the VolumeSnapshot CRDs exist.
  dependsOn:
    - name: snapshot-controller
      namespace: snapshot-controller
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    manageCRDs: true
    # Prometheus scrapes volsync_volume_out_of_sync over plain in-cluster
    # HTTPS without a token (ServiceMonitor in infrastructure/configs).
    metrics:
      disableAuth: true
