# Minimal, sane defaults for a homelab.
# Keep this file small; prefer per-service annotations for routing behavior.

deployment:
  replicas: 1
  # Write access logs to the node so the CrowdSec agent can tail them
  # (kubernetes/security/crowdsec/deployment.yaml mounts the same hostPath).
  additionalVolumes:
    - name: traefik-logs
      hostPath:
        path: /var/log/traefik
        type: DirectoryOrCreate

additionalVolumeMounts:
  - name: traefik-logs
    mountPath: /var/log/traefik

service:
  type: LoadBalancer

providers:
  kubernetesCRD:
    enabled: true
    # Ingresses reference middlewares in other namespaces
    # (authelia-authelia-forwardauth, crowdsec-crowdsec-bouncer).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true

# Make Traefik handle Ingress resources by default unless an ingressClassName is set.
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true
      # Screen every request through the CrowdSec bouncer
      # (Middleware in kubernetes/security/crowdsec/deployment.yaml).
      middlewares:
        - crowdsec-crowdsec-bouncer@kubernetescrd

logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json
    filePath: /var/log/traefik/access.log

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
