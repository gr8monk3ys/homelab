name: org-osv

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  osv:
    # OSV-Scanner v2 is invoked as a job-level reusable workflow; the old
    # google/osv-scanner-action/scan-repo path does not exist as an action
    # (CI failed with "Can't find 'action.yml'").
    # Pinned to the v2.3.8 tag commit.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: false
      upload-sarif: false
