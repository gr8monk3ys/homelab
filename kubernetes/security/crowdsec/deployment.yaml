---
# CrowdSec Agent Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec
    component: agent
spec:
  replicas: 1
  # Single replica on a ReadWriteOnce PVC: Recreate, per the repo rule. A
  # rolling update also cannot fit two agents in the namespace memory quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crowdsec
      component: agent
  template:
    metadata:
      labels:
        app: crowdsec
        component: agent
    spec:
      serviceAccountName: crowdsec
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The image's entrypoint installs hub items, registers the local agent
      # and bouncer, and rewrites config.yaml, all under /etc/crowdsec. With
      # read-only subPath mounts and a non-root user it could do none of that
      # and the agent crash-looped, so the bouncer failed closed and every
      # HTTPS request got 403 (#42). /etc/crowdsec is now a writable emptyDir,
      # seeded with the image's /staging/etc/crowdsec (hub, patterns, ...) and
      # then this repo's config files on top. The entrypoint only copies
      # /staging itself when no config.yaml exists, so it must happen here.
      initContainers:
      - name: seed-etc
        image: crowdsecurity/crowdsec:v1.8.2
        # The credential files live on the data PVC (configmap.yaml). cscli loads
        # both while the entrypoint is still creating them, so, as the image's own
        # /staging templates do, start them empty on first run.
        # (The /staging credential templates are root-only and not needed here.)
        command:
        - sh
        - -c
        - |
          set -e
          for f in /staging/etc/crowdsec/*; do
            case "$(basename "$f")" in *_api_credentials.yaml) ;; *) cp -R "$f" /seed/ ;; esac
          done
          cp /config/config.yaml /config/profiles.yaml /config/simulation.yaml /acquis/acquis.yaml /seed/
          touch /data/local_api_credentials.yaml /data/online_api_credentials.yaml
          # The entrypoint symlinks every missing data file (v1.6.0 linked only
          # the GeoIP databases; v1.8.2 links the preloaded hub data files
          # too) to root-owned /staging copies, which the hub upgrade then
          # cannot overwrite. Real copies can be. Skip the database files, as
          # the entrypoint does.
          for f in /staging/var/lib/crowdsec/data/*; do
            name="$(basename "$f")"
            case "$name" in crowdsec.db*) continue ;; esac
            t="/data/$name"
            [ -L "$t" ] && rm -f "$t"
            [ -e "$t" ] || cp -R "$f" "$t"
          done
        resources:   # the namespace ResourceQuota requires them on every container
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: etc
          mountPath: /seed
        - name: config
          mountPath: /config
          readOnly: true
        - name: acquis
          mountPath: /acquis
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      - name: crowdsec
        image: crowdsecurity/crowdsec:v1.8.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        # The entrypoint registers the bouncer "traefik" with this key; the
        # Traefik plugin (Middleware crowdsec-bouncer below) reads the same key
        # from this Secret. Without the registration the Local API rejects the
        # plugin's pulls and, failing closed, Traefik answers 403 to everything.
        # Registration is skipped when the name already exists, so a rotated key
        # needs `cscli bouncers delete traefik` and an agent restart.
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-config
              key: bouncer-api-key
        - name: COLLECTIONS
          value: "crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
        - name: SCENARIOS
          value: "crowdsecurity/ssh-bf crowdsecurity/http-bf-wordpress_bf crowdsecurity/http-crawl-non_statics"
        - name: PARSERS
          value: "crowdsecurity/traefik-logs crowdsecurity/sshd-logs"
        - name: DISABLE_LOCAL_API
          value: "false"
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-config
              key: enroll-key
              optional: true
        ports:
        - containerPort: 8080
          name: api
        - containerPort: 6060
          name: metrics
        volumeMounts:
        - name: etc
          mountPath: /etc/crowdsec
        - name: data
          mountPath: /var/lib/crowdsec/data
        - name: traefik-logs
          mountPath: /var/log/traefik
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: etc
        emptyDir: {}
      - name: config
        configMap:
          name: crowdsec-config
      - name: acquis
        configMap:
          name: crowdsec-acquis
      - name: data
        persistentVolumeClaim:
          claimName: crowdsec-data-pvc
      - name: traefik-logs
        hostPath:
          path: /var/log/traefik
          type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-data-pvc
  namespace: crowdsec
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec
spec:
  selector:
    app: crowdsec
    component: agent
  ports:
  - name: api
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 6060
    targetPort: 6060
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec
  namespace: crowdsec
---
# RBAC for reading pods/logs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crowdsec-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crowdsec-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec-reader
subjects:
- kind: ServiceAccount
  name: crowdsec
  namespace: crowdsec
---
# The CrowdSec bouncer, run inside Traefik as a plugin
# (maxlerebourg/crowdsec-bouncer-traefik-plugin, loaded by
# experimental.plugins.bouncer in kubernetes/ingress/traefik/values.yaml).
# It replaces the fbonalair/traefik-crowdsec-bouncer Deployment and its
# forwardAuth hop; that image has had no release since 2023. The name stays
# crowdsec-bouncer, so the websecure entrypoint still references
# crowdsec-crowdsec-bouncer@kubernetescrd.
#
# Stream mode: Traefik pulls the decision list from the Local API every
# updateIntervalSeconds and answers each request from memory.
# Fail closed: with updateMaxFailure 0 the first failed pull marks the stream
# unhealthy and every request gets 403 until a pull succeeds again, and
# streamStartupBlock makes Traefik do the first pull before serving (plugin
# README, UpdateMaxFailure and StreamStartupBlock). Right after a Traefik pod
# starts, K3s's policy controller may not yet admit its IP to the Local API
# (see garage-policy in infrastructure-policies.yaml), so expect up to one
# interval of 403s then; it heals on the next pull.
#
# The key: Traefik's Kubernetes CRD provider replaces a urn:k8s:secret:<name>:<key>
# value anywhere in a plugin's config with that key of a Secret in the
# Middleware's own namespace, so nothing is committed and no file is
# mounted into Traefik. The chart's ClusterRole already grants Traefik
# get/list/watch on Secrets (it reads TLS secrets the same way). Until
# Traefik v3.7.16 the resolved value shows in Traefik's API and dashboard;
# the chart publishes neither here (no dashboard IngressRoute, and the
# internal traefik port is not on the Service).
#
# The client IP is the connection's source address: no
# forwardedHeadersTrustedIPs, so a client cannot choose the IP it is checked
# as with X-Forwarded-For (the old forwardAuth set trustForwardHeader).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: crowdsec
spec:
  plugin:
    bouncer:
      enabled: true
      logLevel: INFO
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-agent.crowdsec.svc.cluster.local:8080
      crowdsecLapiKey: urn:k8s:secret:crowdsec-config:bouncer-api-key
      updateIntervalSeconds: 60
      updateMaxFailure: 0
      streamStartupBlock: true
---
# ExternalSecret for CrowdSec configuration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-config
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: crowdsec-config
    creationPolicy: Owner
  data:
  - secretKey: bouncer-api-key
    remoteRef:
      key: crowdsec-config
      property: bouncer-api-key
  - secretKey: enroll-key
    remoteRef:
      key: crowdsec-config
      property: enroll-key
