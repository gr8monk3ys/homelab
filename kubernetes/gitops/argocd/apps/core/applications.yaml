---
# Core Applications
#
# These are the default (or near-default) stacks for this homelab.

# Homelab Secrets (SOPS/age via KSOPS)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
  annotations:
    # Ensure secrets exist before other apps sync.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: homelab-infrastructure
  source:
    repoURL: https://github.com/your-username/homelab.git
    targetRevision: HEAD
    path: kubernetes/secrets/sops
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
