# Harbor installation via in-cluster helm Job.
# The chart values are embedded in the harbor-values ConfigMap below - the
# single source of truth for this deployment.
---
# ExternalSecret for Harbor admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: harbor-admin
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: harbor-admin
      property: password

---
# ServiceAccount for the installer Job. The Job runs helm in-cluster, which
# creates namespaced and cluster-scoped resources across the chart, so it
# needs cluster-admin (acceptable for a one-shot installer in this repo).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-installer
  namespace: harbor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: harbor-installer
  namespace: harbor

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-install-script
  namespace: harbor
data:
  install.sh: |
    #!/bin/bash
    set -e

    # Pinned harbor chart version (chart 1.17.1 = Harbor v2.13.1).
    HARBOR_CHART_VERSION="1.17.1"

    echo "Adding Harbor Helm repository..."
    helm repo add harbor https://helm.goharbor.io
    helm repo update

    echo "Installing Harbor ${HARBOR_CHART_VERSION}..."
    helm upgrade --install harbor harbor/harbor \
      --version "${HARBOR_CHART_VERSION}" \
      --namespace harbor \
      --values /config/values.yaml \
      --wait

    echo "Harbor installation completed!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-values
  namespace: harbor
data:
  values.yaml: |
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
      ingress:
        hosts:
          core: registry.homelab.local
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          cert-manager.io/cluster-issuer: "homelab-ca"

    externalURL: https://registry.homelab.local

    persistence:
      enabled: true
      resourcePolicy: "keep"
      persistentVolumeClaim:
        registry:
          storageClass: "local-path"
          size: 100Gi
        jobservice:
          storageClass: "local-path"
          size: 1Gi
        database:
          storageClass: "local-path"
          size: 10Gi
        redis:
          storageClass: "local-path"
          size: 1Gi
        trivy:
          storageClass: "local-path"
          size: 5Gi

    # Admin password is set via existingSecretAdminPassword
    # harborAdminPassword is intentionally omitted - use secret instead
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: password

    database:
      type: internal

    redis:
      type: internal

    trivy:
      enabled: true

    portal:
      replicas: 1

    core:
      replicas: 1

    jobservice:
      replicas: 1

    registry:
      replicas: 1

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

---
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-installer
  namespace: harbor
spec:
  template:
    spec:
      serviceAccountName: harbor-installer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: installer
        image: alpine/helm:3.16.3
        command: ["/bin/sh", "/scripts/install.sh"]
        env:
        # helm needs a writable HOME for its repo cache/config
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: install-script
          mountPath: /scripts
        - name: values-config
          mountPath: /config
      volumes:
      - name: install-script
        configMap:
          name: harbor-install-script
          defaultMode: 0755
      - name: values-config
        configMap:
          name: harbor-values
      restartPolicy: Never
  backoffLimit: 3
