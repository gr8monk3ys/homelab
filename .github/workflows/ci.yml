---
# The one workflow. The repo is private and Actions minutes are capped:
# nothing scheduled, one short job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A Renovate bump of a *_VERSION fails the checksum step until the matching
# *_SHA256 is updated from that release's checksums file.
env:
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
  KUSTOMIZE_VERSION: 5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
  # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.35.1

jobs:
  validate:
    name: Validate Flux tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0

      - name: Install kustomize, kubeconform and yamllint (pinned)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz -C "$bin" kustomize
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          pipx install "yamllint==${YAMLLINT_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      - name: yamllint, kubeconform, kustomize build per Flux path, no plain Secrets
        run: ./hack/validate.sh
