---
# Service descriptor: the install interface read by scripts/lib/services.sh.
namespace: heimdall
group: core
optin: true
url: dashboard
description: Application dashboard (alternative to Homepage)

# Per-namespace isolation: policy templates under kubernetes/security/network-policies/templates/.
networkPolicies: [default-deny, allow-dns, allow-ingress, allow-monitoring, allow-same-namespace]
