---
# =============================================================================
# ResourceQuotas - Prevent resource exhaustion attacks
# =============================================================================
# These quotas limit total resource consumption per namespace to prevent
# any single namespace from consuming all cluster resources.

# -----------------------------------------------------------------------------
# Critical Services - Higher limits for essential infrastructure
# -----------------------------------------------------------------------------

apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "20"
    requests.storage: 200Gi
    pods: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: argocd
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "5"
    requests.storage: 20Gi
    pods: "20"
---
# -----------------------------------------------------------------------------
# Security Services - Moderate limits
# -----------------------------------------------------------------------------

apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: crowdsec
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    persistentvolumeclaims: "2"
    requests.storage: 5Gi
    pods: "5"
