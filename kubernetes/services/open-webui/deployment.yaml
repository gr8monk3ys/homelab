---
# Open WebUI - ChatGPT-like interface for Ollama
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  # Single writer on a ReadWriteOnce volume: RWO pins the volume to one node,
  # so a rolling update would briefly run two writers there, or stall across
  # nodes. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: open-webui
        # Upgrades migrate webui.db in place on startup (Alembic). Back up
        # /app/backend/data before bumping across a release that notes
        # database migrations.
        image: ghcr.io/open-webui/open-webui:v0.11.4
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OLLAMA_BASE_URL
          value: "http://ollama.ollama.svc.cluster.local:11434"
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: open-webui-secret
              key: secret-key
        - name: ENABLE_SIGNUP
          value: "false"
        - name: DEFAULT_USER_ROLE
          value: "user"
        - name: WEBUI_AUTH
          value: "true"
        # Web search through the homelab's SearXNG (in-cluster, JSON API).
        # These seed Open WebUI's persistent config on first start; once an
        # admin saves Settings > Web Search, the stored values win.
        - name: ENABLE_WEB_SEARCH
          value: "true"
        - name: WEB_SEARCH_ENGINE
          value: "searxng"
        - name: SEARXNG_QUERY_URL
          value: "http://searxng.searxng.svc.cluster.local:8080/search?q=<query>"
        # The image is built for root: its static dir and /root are not
        # writable by UID 1000. On startup it copies frontend assets into
        # STATIC_DIR, so point that and HOME at writable emptyDirs.
        - name: STATIC_DIR
          value: "/app/static"
        - name: HOME
          value: "/home/open-webui"
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        - name: static
          mountPath: /app/static
        - name: home
          mountPath: /home/open-webui
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          # 0.5+ loads a local embedding model for RAG and web search.
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data-pvc
      - name: static
        emptyDir: {}
      - name: home
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data-pvc
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
spec:
  selector:
    app: open-webui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: open-webui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
    cert-manager.io/cluster-issuer: "homelab-ca"
spec:
  tls:
  - hosts:
    - chat.homelab.local
    secretName: open-webui-tls
  rules:
  - host: chat.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              number: 8080
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secret
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: open-webui-secret
    creationPolicy: Owner
  data:
  - secretKey: secret-key
    remoteRef:
      key: open-webui-config
      property: secret-key
