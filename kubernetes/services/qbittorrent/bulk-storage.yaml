---
# qBittorrent's view of the shared media tree: a second static PV onto the
# same bulk directory as arr-stack's (kubernetes/services/arr-stack/shared-storage.yaml),
# because a PersistentVolumeClaim cannot cross namespaces. Both mount it at
# /data, so the paths qBittorrent reports are the paths Sonarr and Radarr see.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bulk-qbittorrent-data
  labels:
    homelab.io/bulk-path: data
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bulk
  claimRef:
    namespace: qbittorrent
    name: media-data
  hostPath:
    path: /mnt/bulk/data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab.io/bulk
              operator: In
              values: ["true"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: bulk
  volumeName: bulk-qbittorrent-data
  resources:
    requests:
      storage: 2Ti
