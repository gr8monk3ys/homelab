---
# ServiceAccount and RBAC for External Secrets "Kubernetes" provider.
# This allows External Secrets Operator to read Secrets from the central `secrets` namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-secret-store
  namespace: secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-secret-store
  namespace: secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # ESO uses this for capability validation.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-secret-store
  namespace: secrets
subjects:
  - kind: ServiceAccount
    name: homelab-secret-store
    namespace: secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelab-secret-store

