---
# Prometheus metrics for Immich. Immich serves them only when telemetry is
# switched on (IMMICH_TELEMETRY_INCLUDE on immich-server, see
# server-deployment.yaml), on two ports of its own, at /metrics:
#   8081  API worker            (IMMICH_API_METRICS_PORT)
#   8082  microservices worker  (IMMICH_MICROSERVICES_METRICS_PORT)
# https://docs.immich.app/features/monitoring
# (The old /api/server-info/metrics path on 2283 does not exist in Immich 2+.)
#
# A metrics-only Service, so the web Service keeps exposing just 2283.
apiVersion: v1
kind: Service
metadata:
  name: immich-server-metrics
  namespace: immich
  labels:
    app: immich-server
    app.kubernetes.io/component: metrics
spec:
  selector:
    app: immich-server
  ports:
  - name: metrics-api
    port: 8081
    targetPort: 8081
  - name: metrics-micro
    port: 8082
    targetPort: 8082
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: immich-server
      app.kubernetes.io/component: metrics
  endpoints:
  - port: metrics-api
    path: /metrics
    interval: 30s
  - port: metrics-micro
    path: /metrics
    interval: 30s
---
# The allow-monitoring template opens only the common exporter ports, not
# Immich's 8081/8082; let Prometheus reach them on the server pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-immich-metrics
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app: immich-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
