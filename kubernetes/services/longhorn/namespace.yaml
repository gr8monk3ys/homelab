---
# Pod Security: privileged, not restricted like the app namespaces. Longhorn's
# manager and instance-manager pods mount /dev, /proc and /var/lib/longhorn
# from the host and run privileged to attach iSCSI volumes.
#
# The ExternalSecret rides along in this file because a kind: helm service
# applies exactly one manifest before its chart (namespace.yaml), and the
# chart references the credential Secret by name (defaultBackupStore in
# values.yaml). Under ArgoCD (chart only) create this ExternalSecret yourself.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    name: longhorn-system
    type: core
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Backup-target credentials: the same MinIO user Velero uses
# (velero-minio-credentials, generated by scripts/generate-secrets.sh), in the
# AWS_* key layout Longhorn expects. AWS_ENDPOINTS points Longhorn at the
# in-cluster MinIO instead of Amazon.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-minio-credentials
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: longhorn-minio-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
        AWS_ENDPOINTS: "http://minio.minio.svc.cluster.local:9000"
  data:
  - secretKey: accessKey
    remoteRef:
      key: velero-minio-credentials
      property: access-key
  - secretKey: secretKey
    remoteRef:
      key: velero-minio-credentials
      property: secret-key
