---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homelab-require-run-as-non-root
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  homelab-kyverno: enabled
      validate:
        message: "Pods must set securityContext.runAsNonRoot=true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

