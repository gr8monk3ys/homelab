---
# qBittorrent - BitTorrent Client for arr-stack
# https://www.qbittorrent.org/
#
# First login: qBittorrent 4.6.1+ has no default password; it prints a
# temporary one for user admin to the pod log on first start
# (kubectl -n qbittorrent logs deploy/qbittorrent). Change it in the Web UI.
#
# Downloads land in the shared media tree (bulk-storage.yaml) at /data,
# the same path Sonarr and Radarr see, so imports are hardlinks. In
# Options > Downloads set the default save path to /data/torrents and use
# categories "tv" and "movies" (saving to /data/torrents/tv, .../movies).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # The home-operations image runs as any non-root UID with a read-only
      # root filesystem; the LinuxServer.io image needs root and setuid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: qbittorrent
        image: ghcr.io/home-operations/qbittorrent:5.2.3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
        - name: TZ
          value: "UTC"
        - name: QBT_WEBUI_PORT
          value: "8080"
        - name: QBT_TORRENTING_PORT
          value: "6881"
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          name: torrent-tcp
          protocol: TCP
        - containerPort: 6881
          name: torrent-udp
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config-pvc
      - name: data
        persistentVolumeClaim:
          claimName: media-data
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
---
# Config and resume data: SSD, never bulk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  selector:
    app: qbittorrent
  ports:
  - name: webui
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
# Service for BitTorrent traffic (optional - use with LoadBalancer or NodePort)
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-torrent
  namespace: qbittorrent
spec:
  selector:
    app: qbittorrent
  ports:
  - name: torrent-tcp
    port: 6881
    targetPort: 6881
    protocol: TCP
  - name: torrent-udp
    port: 6881
    targetPort: 6881
    protocol: UDP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-ingress
  namespace: qbittorrent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
    cert-manager.io/cluster-issuer: "homelab-ca"
spec:
  tls:
  - hosts:
    - torrent.homelab.local
    secretName: qbittorrent-tls
  rules:
  - host: torrent.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: qbittorrent
            port:
              number: 8080
