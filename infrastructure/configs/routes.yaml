---
# Infrastructure UIs on the Gateway. Grafana has its own login
# (admin / GRAFANA_ADMIN_PASSWORD from cluster-secrets).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
  hostnames:
    - "grafana.${DOMAIN}"
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
