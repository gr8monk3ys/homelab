# Default values for nextcloud
# This is a YAML-formatted file.

global:
  storageClass: "local-path"

nextcloud:
  image:
    repository: nextcloud
    # Nextcloud's current production release (the image's `production` tag
    # was 34 when this was pinned). Upgrades go one major at a time, each
    # followed by `occ upgrade` (the image's entrypoint runs it on start).
    tag: "34.0.4-apache"
    pullPolicy: IfNotPresent

  # Admin user configuration
  admin:
    # These will be populated from secrets
    username: ""  # Set via secret
    password: ""  # Set via secret

  # Domain configuration
  domain: "nextcloud.homelab.local"
  trustedDomains:
    - "nextcloud.homelab.local"
    - "localhost"

  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Health checks
  # Startup budget of 10 minutes: a fresh install took ~2.5 min, longer than
  # the liveness delay, and was killed mid-install.
  startupProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  # Security context
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33

  # Persistence
  persistence:
    enabled: true
    size: 100Gi
    storageClass: "local-path"
    accessMode: ReadWriteOnce

  config:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: "local-path"
      accessMode: ReadWriteOnce

mariadb:
  # MariaDB, not MySQL: the Nextcloud admin manual ("System requirements")
  # lists MariaDB as the recommended MySQL-family database (alongside
  # PostgreSQL); MySQL 8.4 is supported, not recommended. 11.8 is MariaDB's
  # current long-term-support series and is on Nextcloud 34's supported list.
  # The official image; runs as its mysql user (999), templates/mariadb.yaml.
  image:
    repository: mariadb
    tag: "11.8.9"
    pullPolicy: IfNotPresent
  # Credentials come from the ESO-managed secret rendered by
  # templates/external-secrets.yaml (keys: password, root-password).
  database: "nextcloud"
  username: "nextcloud"
  innodbBufferPoolSize: "512M"
  persistence:
    size: 20Gi
    storageClass: "local-path"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "homelab-ca"
  hosts:
    - host: nextcloud.homelab.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nextcloud-tls
      hosts:
        - nextcloud.homelab.local

# External secrets configuration
externalSecrets:
  enabled: true
  secretStore: "homelab-secret-store"
  secretStoreKind: "ClusterSecretStore"
  refreshInterval: "1h"
