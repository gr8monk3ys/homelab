---
# Seerr: media requests (successor of Jellyseerr). Users sign in with their
# Jellyfin accounts and requests go to Sonarr/Radarr.
# First visit: the setup wizard; choose Jellyfin (http://jellyfin:8096), then
# add Sonarr (sonarr:8989) and Radarr (radarr:7878) with their API keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  labels:
    app.kubernetes.io/name: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.2
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: PORT
              value: "5055"
          ports:
            - name: http
              containerPort: 5055
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes its image cache under /app/.next/cache at runtime.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr
        - name: tmp
          emptyDir: {}
