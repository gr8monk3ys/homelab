---
# No VolSync component: copying Postgres files in place is not a consistent
# backup. Immich dumps the database nightly (pg_dumpall, 02:00) into the
# library's backups/ directory, which the immich PVC backup carries offsite.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-db
  namespace: flux-system
spec:
  targetNamespace: photos
  path: ./apps/photos/immich-db/app
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
