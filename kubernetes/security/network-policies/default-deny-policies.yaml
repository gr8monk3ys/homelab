# Default deny ingress for namespaces that have no service descriptor.
#
# Every catalogued service declares its own isolation in service.yaml
# (networkPolicies: [default-deny, ...]; templates live in ./templates/), so
# its default-deny lives there, not here. Nextcloud is Helm-managed
# (helm/nextcloud/) and has no descriptor, so it stays static.
---
# Default deny ingress for nextcloud namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nextcloud
spec:
  podSelector: {}
  policyTypes:
    - Ingress
