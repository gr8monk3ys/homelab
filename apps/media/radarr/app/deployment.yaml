---
# Radarr: movie manager. Searches through Prowlarr, downloads with qBittorrent.
# First visit: set authentication (Forms), then add qBittorrent (qbittorrent:8080, category movies) and root folder /data/media/movies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radarr
          # home-operations images run as any UID with a read-only root.
          # Stable line only: 7.x is a prerelease (renovate.json5 caps it).
          image: ghcr.io/home-operations/radarr:6.4.4.10685
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: RADARR__SERVER__PORT
              value: "7878"
            - name: RADARR__LOG__DBENABLED
              value: "False"
          ports:
            - name: http
              containerPort: 7878
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: tmp
          emptyDir: {}
