---
apiVersion: v1
kind: Namespace
metadata:
  name: files
  labels:
    # OpenCloud meets "restricted", but VolSync's mover pods set neither
    # runAsNonRoot nor a seccomp profile (components/volsync's
    # moverSecurityContext would have to add them).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Nothing reaches a pod here unless its app's NetworkPolicy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: files
spec:
  podSelector: {}
  policyTypes: [Ingress]
