---
# Homelab settings read by scripts/lib/render.sh (homelab_load_config).
#
# Only the keys below are read. Each one is overridden by the environment
# variable named next to it, and the values are substituted for the
# placeholders that manifests carry in git (see scripts/lib/render.sh).
#
# What installs is chosen by the ENABLE_*_SERVICES / INSTALL_* toggles and
# OPTIN_SERVICES environment variables, not by this file: see docs/services.md.
# Tool and chart versions are pinned in tools/versions.env.
homelab:
  domain: "homelab.local"            # DOMAIN
  timezone: "UTC"                    # TIMEZONE
  email: "admin@homelab.local"       # ADMIN_EMAIL
  environment: "production"          # ENVIRONMENT (parsed, currently unused)

ingress:
  cert_manager:
    # Default issuer for internal domains (local CA).
    cluster_issuer: "homelab-ca"     # CERT_MANAGER_CLUSTER_ISSUER

gitops:
  # Used by the ArgoCD bootstrap manifests (kubernetes/gitops/argocd/*).
  repo_url: "https://github.com/your-username/homelab.git"  # GITOPS_REPO_URL
