name: security-baseline

on:
  push:
    branches:
      - "**"
  pull_request:

permissions: read-all

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Baseline CI check
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import pathlib, re, sys
          import yaml

          fails = []
          skip = re.compile(r"(^|/)(extras|legacy)(/|$)")
          root = pathlib.Path("kubernetes")

          def containers(doc):
              spec = (doc.get("spec") or {}).get("template", {}).get("spec", {}) or {}
              return (spec.get("containers") or []) + (spec.get("initContainers") or [])

          secret_re = re.compile(
              r"(password|passwd|secret|token|value)\s*[:=]\s*['\"]?"
              r"(admin123|password123|changeme|change-me-please|letmein|secret123|admin@123)\b",
              re.IGNORECASE,
          )

          for path in sorted(root.rglob("*.y*ml")):
              rel = str(path)
              if skip.search(rel):
                  continue
              text = path.read_text(errors="replace")
              if "{{" in text:  # helm-templated manifests can't be checked structurally
                  continue
              # (a) image references must carry a pinned, non-latest tag
              for i, line in enumerate(text.splitlines(), 1):
                  m = re.match(r"\s*(?:-\s+)?image:\s*['\"]?([^'\"\s]+)['\"]?\s*$", line)
                  if m:
                      image = m.group(1)
                      if image.startswith("$"):  # env-substituted at install time
                          continue
                      tag = image.rsplit("/", 1)[-1]
                      if ":" not in tag and "@" not in image:
                          fails.append(f"{rel}:{i}: image without a pinned tag: {image}")
                      elif re.search(r":latest($|@)", image):
                          fails.append(f"{rel}:{i}: image pinned to :latest: {image}")
                  # (c) obvious hardcoded secret literals
                  if secret_re.search(line):
                      fails.append(f"{rel}:{i}: hardcoded secret literal")
              # (b) workloads under kubernetes/services/ must disable privilege escalation
              if not rel.startswith("kubernetes/services/"):
                  continue
              try:
                  docs = list(yaml.safe_load_all(text))
              except yaml.YAMLError as e:
                  fails.append(f"{rel}: unparseable YAML: {e}")
                  continue
              for doc in docs:
                  if not isinstance(doc, dict) or doc.get("kind") not in ("Deployment", "StatefulSet"):
                      continue
                  name = (doc.get("metadata") or {}).get("name", "?")
                  for c in containers(doc):
                      sc = c.get("securityContext") or {}
                      if sc.get("allowPrivilegeEscalation") is not False:
                          fails.append(
                              f"{rel}: {doc['kind']}/{name} container "
                              f"'{c.get('name', '?')}' lacks allowPrivilegeEscalation: false"
                          )

          if fails:
              print("Security baseline violations:")
              print("\n".join(f"  {f}" for f in fails))
              sys.exit(1)
          print("Security baseline checks passed")
          EOF
