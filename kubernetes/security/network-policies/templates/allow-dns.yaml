---
# Policy template: allow-dns
# Lets every pod in the namespace resolve names through CoreDNS (K3s labels
# it k8s-app=kube-dns in kube-system).
# The namespace is filled in by scripts/lib/netpol.sh at install time.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: PLACEHOLDER_NAMESPACE
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
