# Default values for nextcloud
# This is a YAML-formatted file.

global:
  storageClass: "local-path"

nextcloud:
  image:
    repository: nextcloud
    tag: "28-apache"
    pullPolicy: IfNotPresent

  # Admin user configuration
  admin:
    # These will be populated from secrets
    username: ""  # Set via secret
    password: ""  # Set via secret

  # Domain configuration
  domain: "nextcloud.homelab.local"
  trustedDomains:
    - "nextcloud.homelab.local"
    - "localhost"

  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Health checks
  # Startup budget of 10 minutes: a fresh install took ~2.5 min, longer than
  # the liveness delay, and was killed mid-install.
  startupProbe:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5

  # Security context
  securityContext:
    runAsUser: 33
    runAsGroup: 33
    fsGroup: 33

  # Persistence
  persistence:
    enabled: true
    size: 100Gi
    storageClass: "local-path"
    accessMode: ReadWriteOnce

  config:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: "local-path"
      accessMode: ReadWriteOnce

mysql:
  enabled: true
  # Bitnami removed its images from docker.io/bitnami, so the chart's default
  # docker.io/bitnami/mysql:8.0.34-debian-11-r75 no longer resolves. The same
  # build is preserved read-only under docker.io/bitnamilegacy. STOPGAP: that
  # repo gets no updates (and MySQL 8.0 is itself EOL); replace the Bitnami
  # subchart with a StatefulSet on the official mysql:8.4 LTS image.
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: 8.0.34-debian-11-r75
  # Add a stable app label so NetworkPolicies can target MySQL pods.
  commonLabels:
    app: nextcloud-mysql
  auth:
    # Credentials come from the ESO-managed secret rendered by
    # templates/external-secrets.yaml (keys: mysql-root-password, mysql-password).
    existingSecret: nextcloud-db-password
    database: "nextcloud"
    username: "nextcloud"

  primary:
    podLabels:
      app: nextcloud-mysql
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    # Chart default (runAsUser 1001, runAsNonRoot) plus the repo baseline.
    # readOnlyRootFilesystem stays off: the Bitnami entrypoint writes its
    # runtime config under /opt/bitnami/mysql.
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "local-path"

    # Chart defaults (~2 min startup budget, 1s liveness timeout) are too
    # tight on a busy single-node cluster: mysqld was killed mid-startup.
    startupProbe:
      enabled: true
      failureThreshold: 30
      timeoutSeconds: 5
    livenessProbe:
      enabled: true
      timeoutSeconds: 5
    readinessProbe:
      enabled: true
      timeoutSeconds: 5

    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

    # This value replaces the chart's whole my.cnf, so it must carry the
    # Bitnami paths (socket, datadir, pid, plugins); without them mysqld never
    # opens the socket the probes use. Tuning lines are appended at the end.
    # (query_cache_size was dropped: MySQL 8.0 removed it and refuses to start.)
    configuration: |-
      [mysqld]
      default_authentication_plugin=mysql_native_password
      skip-name-resolve
      explicit_defaults_for_timestamp
      basedir=/opt/bitnami/mysql
      plugin_dir=/opt/bitnami/mysql/lib/plugin
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      datadir=/bitnami/mysql/data
      tmpdir=/opt/bitnami/mysql/tmp
      max_allowed_packet=16M
      bind-address=*
      pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
      log-error=/opt/bitnami/mysql/logs/mysqld.log
      innodb_buffer_pool_size=512M
      max_connections=100
      character_set_server=utf8mb4
      collation_server=utf8mb4_unicode_ci
      slow_query_log=1
      long_query_time=2

      [client]
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      default-character-set=utf8mb4
      plugin_dir=/opt/bitnami/mysql/lib/plugin

      [manager]
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      pid-file=/opt/bitnami/mysql/tmp/mysqld.pid

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: "homelab-ca"
  hosts:
    - host: nextcloud.homelab.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nextcloud-tls
      hosts:
        - nextcloud.homelab.local

# External secrets configuration
externalSecrets:
  enabled: true
  secretStore: "homelab-secret-store"
  secretStoreKind: "ClusterSecretStore"
  refreshInterval: "1h"
