---
# Service descriptor: the install interface read by scripts/lib/services.sh.
namespace: tautulli
group: media
optin: true
url: stats
# Tautulli monitors Plex Media Server only: it speaks the Plex API and its
# maintainers have kept it Plex-specific. Point it at a Plex server outside
# the cluster (on a NAS, or the Docker host: http://host.docker.internal:32400
# under Docker Desktop). For Jellyfin watch statistics, Jellystat or
# Streamystats are the equivalents; neither is in the catalogue yet.
description: Plex Media Server statistics (Plex only; Plex runs outside the cluster)
requires: [authelia]   # its Ingress routes through Authelia's forward-auth middleware

# Per-namespace isolation: policy templates under kubernetes/security/network-policies/templates/.
# Deliberately open: reaches a Plex server outside the cluster, on the LAN.
networkPolicies: []
