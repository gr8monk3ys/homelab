---
# The media group: Prowlarr, Sonarr, Radarr, Bazarr, qBittorrent behind
# gluetun, Seerr and Jellyfin, all in namespace media. Each app is a Flux
# Kustomization (<app>/ks.yaml) that applies <app>/app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - media-data.yaml
  - prowlarr/ks.yaml
  - sonarr/ks.yaml
  - radarr/ks.yaml
  - bazarr/ks.yaml
  - qbittorrent/ks.yaml
  - seerr/ks.yaml
  - jellyfin/ks.yaml
