---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint And Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned tools into .tools/
        run: ./scripts/install-dev-tools.sh

      - name: bash -n, shellcheck, yamllint, kubeconform, helm lint, kustomize build
        run: ./scripts/ci.sh

      # The default ./setup-v2.sh against a real etcd + kube-apiserver (no
      # kubelet, so it tests order and preconditions, not running pods). The one
      # check that applies manifests instead of rendering them.
      - name: Default install against a live API server
        run: ./test/e2e-default-install.sh
