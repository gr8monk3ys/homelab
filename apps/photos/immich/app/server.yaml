---
# Immich server (API, web and background jobs). The library PVC (the RAID)
# is the only state; Postgres is the immich-db Cluster, Valkey is a cache.
# Restore: hack/restore.sh photos immich (scales this Deployment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  labels:
    app.kubernetes.io/name: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.4.1
          env:
            - name: TZ
              value: "${TIMEZONE}"
            # Takes precedence over DB_HOSTNAME/DB_USERNAME/... (Immich docs).
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: uri
            - name: REDIS_HOSTNAME
              value: valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            # Prometheus metrics on 8081 (API) and 8082 (microservices).
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
          ports:
            - name: http
              containerPort: 2283
            - name: metrics-api
              containerPort: 8081
            - name: metrics-micro
              containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # IMMICH_MEDIA_LOCATION defaults to /data.
            - name: library
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich
  labels:
    app.kubernetes.io/name: immich
spec:
  selector:
    app.kubernetes.io/name: immich
  ports:
    - name: http
      port: 2283
      targetPort: http
    - name: metrics-api
      port: 8081
      targetPort: metrics-api
    - name: metrics-micro
      port: 8082
      targetPort: metrics-micro
