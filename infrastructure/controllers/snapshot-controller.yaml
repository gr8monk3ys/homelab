---
# The CSI VolumeSnapshot CRDs and controller. Nothing here takes snapshots
# (local-path has none), but VolSync's controller watches VolumeSnapshots and
# exits without the CRDs, and K3s does not ship them.
apiVersion: v1
kind: Namespace
metadata:
  name: snapshot-controller
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus
  namespace: snapshot-controller
spec:
  interval: 12h
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 1h
  chart:
    spec:
      chart: snapshot-controller
      version: 5.4.0
      sourceRef:
        kind: HelmRepository
        name: piraeus
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    installCRDs: true
    # Deleting the release must not delete every VolumeSnapshot with it.
    keepCRDs: true
