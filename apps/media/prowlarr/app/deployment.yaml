---
# Prowlarr: indexer manager. Syncs indexers to Sonarr and Radarr.
# First visit: set an authentication method (Forms) in the setup prompt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prowlarr
          # home-operations images run as any UID with a read-only root.
          # Stable line only: 3.x is a prerelease (renovate.json5 caps it).
          image: ghcr.io/home-operations/prowlarr:2.7.0.5723
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: PROWLARR__SERVER__PORT
              value: "9696"
            - name: PROWLARR__LOG__DBENABLED
              value: "False"
          ports:
            - name: http
              containerPort: 9696
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr
        - name: tmp
          emptyDir: {}
