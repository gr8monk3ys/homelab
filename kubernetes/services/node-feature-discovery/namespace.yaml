---
# Pod Security: privileged. The nfd-worker DaemonSet mounts /boot, /sys,
# /usr/lib and /usr/src from the host to detect CPU, PCI, kernel and OS features.
apiVersion: v1
kind: Namespace
metadata:
  name: node-feature-discovery
  labels:
    name: node-feature-discovery
    type: core
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
