---
# Every value is a Flux substitution from cluster-secrets, so this file holds
# no credential (hack/validate.sh allows a Secret only when every value is a
# ${VAR}). One restic repository per app.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-volsync
type: Opaque
stringData:
  RESTIC_REPOSITORY: "s3:${B2_ENDPOINT}/${B2_BUCKET}/volsync/${APP}"
  RESTIC_PASSWORD: "${VOLSYNC_RESTIC_PASSWORD}"
  AWS_ACCESS_KEY_ID: "${B2_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${B2_APP_KEY}"
