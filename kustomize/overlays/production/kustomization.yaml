apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: homelab-production

# Note: namespace override removed to preserve per-service namespaces

resources:
  - ../../base

labels:
  - pairs:
      environment: production
      tier: prod
    includeSelectors: false

# Note: controller replicas and image pinning are managed by Helm chart values.

# Domain, timezone and email are NOT set here: config/homelab.yaml (or env) is
# the single source of truth and scripts/kustomize-apply.sh renders the built
# overlay through scripts/lib/render.sh, exactly like the installer does.
configMapGenerator:
  - name: homelab-config
    literals:
      - environment=production
      - log_level=info
      - backup_enabled=true
      - monitoring_enabled=true
