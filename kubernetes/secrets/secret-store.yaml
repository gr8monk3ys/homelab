---
# ClusterSecretStore backed by in-cluster Kubernetes Secrets.
# ExternalSecret resources reference this store to copy data out of the central `secrets` namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: homelab-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: secrets
      server:
        # Defaults to https://kubernetes.default.svc when omitted.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: homelab-secret-store
          namespace: secrets

