---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full ArgoCD Applications ("app-of-apps").
#
# Includes:
# - Core apps (../core/applications.yaml)
# - Optional stacks (this directory)

resources:
  - ../core/applications.yaml
  - applications.yaml

configMapGenerator:
  - name: homelab-gitops-config
    literals:
      # Update this in one place to change the repo URL for all child Applications.
      - repoURL=https://github.com/your-username/homelab.git

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: homelab-gitops-config
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.source.repoURL
