---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: calibre-web
spec:
  hard:
    # Sized for both deployments in this namespace: calibre-web
    # (100m/256Mi requests, 1/1Gi limits) and calibre-server (200m/512Mi,
    # 1/2Gi), and the 5Gi config + 100Gi books PVCs. The previous values were
    # below what calibre-server alone declares, so no pod could be admitted.
    requests.cpu: "500m"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 3Gi
    persistentvolumeclaims: "3"
    requests.storage: 110Gi
    pods: "5"
