---
# Sonarr: TV series manager. Searches through Prowlarr, downloads with qBittorrent.
# First visit: set authentication (Forms), then add qBittorrent (qbittorrent:8080, category tv) and root folder /data/media/tv.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app.kubernetes.io/name: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sonarr
          # home-operations images run as any UID with a read-only root.
          # Stable line only: 5.x is a prerelease (renovate.json5 caps it).
          image: ghcr.io/home-operations/sonarr:4.0.20.3012
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: SONARR__SERVER__PORT
              value: "8989"
            - name: SONARR__LOG__DBENABLED
              value: "False"
          ports:
            - name: http
              containerPort: 8989
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: tmp
          emptyDir: {}
