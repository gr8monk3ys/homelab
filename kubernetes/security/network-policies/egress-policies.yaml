# Egress allow-lists that are finer than the per-namespace templates.
#
# Namespace-wide default-deny and allow-dns for every catalogued service
# (Nextcloud included, via its kind: helm descriptor) come from its
# service.yaml (networkPolicies:) via scripts/lib/netpol.sh. The per-pod rules
# below (app -> its database, app -> internet) are additive on top of the
# templates and stay as documentation of what each app actually needs.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  namespace: authelia
spec:
  podSelector:
    matchLabels:
      app: authelia
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: authelia-redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-egress
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: nextcloud-mysql
      ports:
        - protocol: TCP
          port: 3306
---
# Nextcloud needs external HTTPS for app store, federation, updates
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
