---
# ExternalSecret for Alertmanager notification routing.
#
# Source secret (source-of-truth):
# - Namespace: secrets
# - Name:      alertmanager-webhook
# - Key:       url
#
# This is opt-in. See docs/runbooks/alerting.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: homelab-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-webhook
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: alertmanager-webhook
      property: url

