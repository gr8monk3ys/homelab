---
# Static NetworkPolicies in this namespace: the per-pod and cross-namespace
# rules the networkPolicies: templates in service.yaml cannot express.
# Applied by install_service with the rest of this directory.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-frigate
  namespace: home-assistant
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frigate
      ports:
        - protocol: TCP
          port: 1883
