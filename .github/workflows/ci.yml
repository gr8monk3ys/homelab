---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # verify_summary.py writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

jobs:
  lint:
    name: Lint And Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned tools into .tools/
        run: ./scripts/install-dev-tools.sh

      - name: bash -n, shellcheck, yamllint, kubeconform, helm lint, kustomize build
        run: ./scripts/ci.sh

      # Counts are the resources kubeconform checked (JUnit, one testcase each).
      - name: Validated-resource evidence
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/verify_summary.py kubeconform-manifests reports/kubeconform-manifests.xml
          python3 scripts/verify_summary.py kubeconform-services reports/kubeconform-services.xml

      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-stage-lint
          path: verify-stages/
          retention-days: 1

      # The default ./setup-v2.sh against a real etcd + kube-apiserver (no
      # kubelet, so it tests order and preconditions, not running pods). The one
      # check that applies manifests instead of rendering them.
      - name: Default install against a live API server
        run: ./test/e2e-default-install.sh

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: kubeconform-manifests kubeconform-services
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
