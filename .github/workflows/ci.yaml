---
# =============================================================================
# Homelab CI Pipeline
# =============================================================================
# Runs the same repo checks as `./scripts/ci.sh` plus optional security scanning.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint And Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo-local dev tools
        run: ./scripts/install-dev-tools.sh

      - name: Run repo checks
        run: ./scripts/ci.sh

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TruffleHog (verified findings only)
        uses: trufflesecurity/trufflehog@v3.93.3
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (table)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          skip-dirs: kubernetes/network-policies,kubernetes/security/network-policies

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: kubernetes/
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore
          skip-dirs: kubernetes/network-policies,kubernetes/security/network-policies

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, security-scan]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint And Validate | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Scanning | ${{ needs.secret-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan (Trivy) | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
