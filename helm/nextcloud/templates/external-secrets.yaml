{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "nextcloud.fullname" . }}-admin
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "nextcloud.fullname" . }}-admin
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: nextcloud-admin
      property: username
  - secretKey: password
    remoteRef:
      key: nextcloud-admin
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "nextcloud.fullname" . }}-db-password
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "nextcloud.fullname" . }}-db-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Key consumed by the Nextcloud container (MYSQL_PASSWORD)
        password: "{{ `{{ .password }}` }}"
        # Keys expected by the Bitnami MySQL subchart (mysql.auth.existingSecret)
        mysql-password: "{{ `{{ .password }}` }}"
        mysql-root-password: "{{ `{{ .rootPassword }}` }}"
  data:
  - secretKey: password
    remoteRef:
      key: nextcloud-db-password
      property: password
  - secretKey: rootPassword
    remoteRef:
      key: mysql-root-password
      property: password
{{- end }}
