---
# SOPS with age. Flux decrypts *.sops.yaml with the private key in the
# flux-system/sops-age Secret (hack/bootstrap.sh creates it).
#
# The private key is never in this repo. It lives at
# ~/.config/sops/age/keys.txt on the host (sops's default on Linux) and in
# the owner's password manager. Without it the secrets in Git are unreadable,
# so a rebuild needs it: docs/runbooks/disaster-recovery.md.
creation_rules:
  - path_regex: (clusters|infrastructure|apps)/.*\.sops\.ya?ml$
    encrypted_regex: '^(data|stringData)$'
    age: age1gd2q7w28vglxlzamrxtwdy57aarkdsxpekzu8mf0nsmuefdehgmsc0g4lt
